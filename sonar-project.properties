sonar.organization=gerjos16-spec
sonar.projectKey=gerjos16-spec_web-personal

# Qué se analiza y qué no
sonar.sources=.
sonar.exclusions=node_modules/**,tests/**,eslint.config.mjs,.github/**
sonar.tests=tests

# Dónde está el informe de cobertura de los tests
sonar.javascript.lcov.reportPaths=lcov.info

# Evitar que se cuente la cobertura de los tests
sonar.coverage.exclusions=**

# Esperar al Quality Gate y fallar si no se cumple
sonar.qualitygate.wait=true

# No contar duplicación en HTML estático (header/footer/secciones repetidas sin plantillas)
sonar.cpd.exclusions=**/*.html
